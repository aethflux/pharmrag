services:
  streamlit:
    build: .
    command: python -m streamlit run app.py --server.address 0.0.0.0 --server.port 8501 --browser.gatherUsageStats false
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./knowledge:/app/knowledge
      - ./personal_knowledge:/app/personal_knowledge
      - ./.cache/vectorstore:/app/.cache/vectorstore
      - ./memory:/app/memory
      - ./logs:/app/logs

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge:/app/knowledge
      - ./personal_knowledge:/app/personal_knowledge
      - ./.cache/vectorstore:/app/.cache/vectorstore
      - ./memory:/app/memory
      - ./logs:/app/logs
